<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
        <meta charset="utf-8">
        <title>HuertoHogar - Iniciar sesión</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>

        <nav id="menu">
            <a href="index.html">Inicio</a>
            <a href="tienda.html">Tienda</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="registro.html">Registro</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>

        <section id="login">
            <h1>Iniciar sesión</h1>
            <p>Accede a tu cuenta de HuertoHogar para gestionar tus pedidos y preferencias.</p>

            <form id="formulario-login">
                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña">
                </div>
                <button type="submit">Entrar</button>
            </form>

            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </section>

        <footer id="piedepagina">
            <ul>
                <li>HuertoHogar &copy; 2026</li>
                <li>Contacto: contacto@huertohogar.cl</li>
            </ul>
        </footer>

        <script src="login.js"></script>
        <script src="menu.js"></script>

    </body>
</html>
